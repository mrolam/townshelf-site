<!doctype html><html lang="en"><head><title>Shop local shops · Townshelf (preview)</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.png?v=3" type="image/png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1C8A94">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Townshelf"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
<script src="data/data.js"></script><script src="js/art.js"></script><script src="js/app.js"></script><script src="js/pwa.js" defer></script>
</head><body>
<div id="site-header"></div>
<main>
<div class="page-head"><div class="wrap"><div class="eyebrow">Shop</div><h1>Shop local, from anywhere</h1><p>Filter by category, condition, shop or town. Everything here is Townshelf Checked and ships from a real storefront.</p></div></div>
<div class="wrap browse">
  <aside class="filters" aria-label="Filters">
    <label for="q">Search</label><input type="search" id="q" placeholder="Try “lamp” or “Austin”">
    <label for="fCat">Category</label><select id="fCat"><option value="">All categories</option></select>
    <label>Condition</label><div class="checks" id="fCond"></div>
    <label for="fStore">Shop</label><select id="fStore"><option value="">All shops</option></select>
    <label for="fTown">Town</label><select id="fTown"><option value="">All towns</option></select>
    <label for="fSort">Sort</label><select id="fSort"><option value="">Featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select>
    <button class="btn btn-ghost" style="margin-top:20px;width:100%" id="reset">Clear filters</button>
  </aside>
  <div>
    <div id="catChips"></div>
    <div class="result-bar"><strong id="count"></strong><span class="muted small">Sample items · prices are placeholders</span></div>
    <div data-loading-strip></div>
    <div class="grid" id="results"></div>
    <div class="empty" id="empty" style="display:none"><h3>No matches on these shelves yet</h3><p class="muted">Try clearing a filter.</p></div>
  </div>
</div>
<section class="sec-cream" id="towns"><div class="wrap">
  <div class="sec-head"><div><div class="eyebrow">Shop by town</div><h2>All shops</h2></div></div>
  <div data-loading-strip data-tone="white"></div>
  <div class="store-grid" id="allStores"></div>
</div></section>
</main>
<div id="site-footer"></div>
<script>
TS.chrome("browse.html");
var D=TS.D,$=function(i){return document.getElementById(i);};
TS.categories().forEach(function(c){$("fCat").add(new Option(c,c));});
D.stores.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(s){$("fStore").add(new Option(s.name,s.slug));});
TS.towns().forEach(function(t){$("fTown").add(new Option(t,t));});
$("fCond").innerHTML=TS.CONDITIONS.map(function(c){return '<label><input type="checkbox" value="'+c+'" checked> '+TS.condBadge(c)+'</label>';}).join("");
$("allStores").innerHTML=D.stores.map(TS.storeCard).join("");
var p=new URLSearchParams(location.search);
if(p.get("q"))$("q").value=p.get("q");
if(p.get("cat"))$("fCat").value=p.get("cat");
if(p.get("store"))$("fStore").value=p.get("store");
if(p.get("town"))$("fTown").value=p.get("town");
if(p.get("cond"))document.querySelectorAll("#fCond input").forEach(function(i){i.checked=(i.value===p.get("cond"));});
function syncChips(){var c=$("fCat").value;document.querySelectorAll("#catChips .chip").forEach(function(ch){ch.classList.toggle("on",ch.getAttribute("data-cat")===c);});}
$("catChips").innerHTML=TS.categoryChips($("fCat").value);
$("catChips").addEventListener("click",function(e){var ch=e.target.closest(".chip");if(!ch)return;e.preventDefault();$("fCat").value=ch.getAttribute("data-cat");run();});
function run(){
  var q=$("q").value.trim().toLowerCase(), cat=$("fCat").value, st=$("fStore").value, town=$("fTown").value;
  var conds=[].slice.call(document.querySelectorAll("#fCond input:checked")).map(function(i){return i.value;});
  var r=D.items.filter(function(it){var s=TS.store(it.store)||{};var tn=s.town+", "+s.state;
    if(cat&&it.category!==cat)return false; if(st&&it.store!==st)return false; if(town&&tn!==town)return false;
    if(conds.indexOf(it.condition)<0)return false;
    if(q){var hay=[it.title,it.category,it.description,s.name,s.town,s.state,tn,s.category].join(" ").toLowerCase(); if(q.split(/\s+/).some(function(w){return hay.indexOf(w)<0;}))return false;}
    return true;});
  var so=$("fSort").value; if(so==="lo")r.sort(function(a,b){return a.price-b.price;}); if(so==="hi")r.sort(function(a,b){return b.price-a.price;});
  $("results").innerHTML=r.map(TS.itemCard).join(""); $("count").textContent=r.length+" item"+(r.length===1?"":"s");
  $("empty").style.display=r.length?"none":""; syncChips();
}
["q","fCat","fStore","fTown","fSort"].forEach(function(i){$(i).addEventListener("input",run);});
$("fCond").addEventListener("change",run);
$("reset").onclick=function(){$("q").value="";["fCat","fStore","fTown","fSort"].forEach(function(i){$(i).value="";});document.querySelectorAll("#fCond input").forEach(function(i){i.checked=true;});run();};
run();
</script>
</body></html>
